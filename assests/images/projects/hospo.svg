<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f4c75;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00b4d8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.04" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" />

  <!-- Grid lines decoration -->
  <line x1="0" y1="112" x2="800" y2="112" stroke="white" stroke-opacity="0.05" stroke-width="1"/>
  <line x1="0" y1="225" x2="800" y2="225" stroke="white" stroke-opacity="0.05" stroke-width="1"/>
  <line x1="0" y1="337" x2="800" y2="337" stroke="white" stroke-opacity="0.05" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="450" stroke="white" stroke-opacity="0.05" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="450" stroke="white" stroke-opacity="0.05" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="450" stroke="white" stroke-opacity="0.05" stroke-width="1"/>

  <!-- Big circle decoration -->
  <circle cx="680" cy="80" r="120" fill="white" fill-opacity="0.04" />
  <circle cx="680" cy="80" r="80" fill="white" fill-opacity="0.04" />
  <circle cx="100" cy="400" r="90" fill="white" fill-opacity="0.04" />

  <!-- Cross/Plus icon (medical) -->
  <rect x="52" y="35" width="14" height="46" rx="4" fill="white" fill-opacity="0.9"/>
  <rect x="36" y="51" width="46" height="14" rx="4" fill="white" fill-opacity="0.9"/>

  <!-- Badge -->
  <rect x="36" y="110" width="130" height="26" rx="13" fill="white" fill-opacity="0.15"/>
  <text x="101" y="128" font-family="Arial, sans-serif" font-size="12" fill="white" fill-opacity="0.9" text-anchor="middle" font-weight="600">HEALTHCARE PLATFORM</text>

  <!-- Title -->
  <text x="36" y="185" font-family="Arial, sans-serif" font-size="44" font-weight="800" fill="white">Hospo</text>
  <text x="36" y="232" font-family="Arial, sans-serif" font-size="44" font-weight="800" fill="white" fill-opacity="0.75">Healthcare</text>

  <!-- Divider -->
  <rect x="36" y="252" width="60" height="3" rx="2" fill="#00e5ff"/>

  <!-- Description -->
  <text x="36" y="284" font-family="Arial, sans-serif" font-size="14" fill="white" fill-opacity="0.8">Real-time multi-role healthcare ecosystem</text>
  <text x="36" y="304" font-family="Arial, sans-serif" font-size="14" fill="white" fill-opacity="0.8">with WebSockets &amp; video consultations</text>

  <!-- Feature chips -->
  <rect x="36" y="325" width="98" height="24" rx="12" fill="white" fill-opacity="0.15"/>
  <text x="85" y="341" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="600">WebSockets</text>

  <rect x="144" y="325" width="90" height="24" rx="12" fill="white" fill-opacity="0.15"/>
  <text x="189" y="341" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="600">Video Calls</text>

  <rect x="244" y="325" width="78" height="24" rx="12" fill="white" fill-opacity="0.15"/>
  <text x="283" y="341" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="600">Real-Time</text>

  <rect x="36" y="357" width="72" height="24" rx="12" fill="white" fill-opacity="0.15"/>
  <text x="72" y="373" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="600">Node.js</text>

  <rect x="118" y="357" width="68" height="24" rx="12" fill="white" fill-opacity="0.15"/>
  <text x="152" y="373" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="600">React.js</text>

  <rect x="196" y="357" width="78" height="24" rx="12" fill="white" fill-opacity="0.15"/>
  <text x="235" y="373" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="600">MongoDB</text>

  <!-- Right panel - Role cards -->
  <rect x="440" y="40" width="160" height="72" rx="12" fill="url(#card)" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
  <text x="468" y="68" font-family="Arial, sans-serif" font-size="22">🏥</text>
  <text x="500" y="64" font-family="Arial, sans-serif" font-size="13" fill="white" font-weight="700">Hospital</text>
  <text x="500" y="82" font-family="Arial, sans-serif" font-size="11" fill="white" fill-opacity="0.7">Provider Panel</text>

  <rect x="620" y="40" width="150" height="72" rx="12" fill="url(#card)" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
  <text x="646" y="68" font-family="Arial, sans-serif" font-size="22">👨‍⚕️</text>
  <text x="678" y="64" font-family="Arial, sans-serif" font-size="13" fill="white" font-weight="700">Doctor</text>
  <text x="678" y="82" font-family="Arial, sans-serif" font-size="11" fill="white" fill-opacity="0.7">Video &amp; Bookings</text>

  <rect x="440" y="132" width="160" height="72" rx="12" fill="url(#card)" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
  <text x="468" y="160" font-family="Arial, sans-serif" font-size="22">🚑</text>
  <text x="500" y="156" font-family="Arial, sans-serif" font-size="13" fill="white" font-weight="700">Ambulance</text>
  <text x="500" y="174" font-family="Arial, sans-serif" font-size="11" fill="white" fill-opacity="0.7">Live Tracking</text>

  <rect x="620" y="132" width="150" height="72" rx="12" fill="url(#card)" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
  <text x="646" y="160" font-family="Arial, sans-serif" font-size="22">🧪</text>
  <text x="678" y="156" font-family="Arial, sans-serif" font-size="13" fill="white" font-weight="700">Pathlab</text>
  <text x="678" y="174" font-family="Arial, sans-serif" font-size="11" fill="white" fill-opacity="0.7">Test Orders</text>

  <rect x="440" y="224" width="160" height="72" rx="12" fill="url(#card)" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
  <text x="468" y="252" font-family="Arial, sans-serif" font-size="22">💊</text>
  <text x="500" y="248" font-family="Arial, sans-serif" font-size="13" fill="white" font-weight="700">Chemist</text>
  <text x="500" y="266" font-family="Arial, sans-serif" font-size="11" fill="white" fill-opacity="0.7">Medicine Orders</text>

  <rect x="620" y="224" width="150" height="72" rx="12" fill="url(#card)" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
  <text x="646" y="252" font-family="Arial, sans-serif" font-size="22">👤</text>
  <text x="678" y="248" font-family="Arial, sans-serif" font-size="13" fill="white" font-weight="700">User Panel</text>
  <text x="678" y="266" font-family="Arial, sans-serif" font-size="11" fill="white" fill-opacity="0.7">Book &amp; Track</text>

  <!-- Bottom stat bar -->
  <rect x="440" y="330" width="330" height="80" rx="12" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
  <text x="530" y="362" font-family="Arial, sans-serif" font-size="11" fill="white" fill-opacity="0.6" text-anchor="middle">ROLES</text>
  <text x="530" y="384" font-family="Arial, sans-serif" font-size="24" fill="white" font-weight="800" text-anchor="middle">5+</text>
  <line x1="580" y1="340" x2="580" y2="400" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
  <text x="660" y="362" font-family="Arial, sans-serif" font-size="11" fill="white" fill-opacity="0.6" text-anchor="middle">REAL-TIME</text>
  <text x="660" y="384" font-family="Arial, sans-serif" font-size="24" fill="white" font-weight="800" text-anchor="middle">WS</text>
  <line x1="710" y1="340" x2="710" y2="400" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
  <text x="755" y="362" font-family="Arial, sans-serif" font-size="11" fill="white" fill-opacity="0.6" text-anchor="middle">VIDEO</text>
  <text x="755" y="384" font-family="Arial, sans-serif" font-size="24" fill="white" font-weight="800" text-anchor="middle">✓</text>
</svg>
