  <text x="515" y="216" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="700" text-anchor="middle">User Mgmt</text>

  <rect x="606" y="158" width="154" height="80" rx="10" fill="url(#card)" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
  <text x="683" y="192" font-family="Arial, sans-serif" font-size="28" text-anchor="middle">🏷️</text>
  <text x="683" y="216" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="700" text-anchor="middle">Coupon System</text>

  <rect x="438" y="250" width="154" height="80" rx="10" fill="url(#card)" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
  <text x="515" y="284" font-family="Arial, sans-serif" font-size="28" text-anchor="middle">📊</text>
  <text x="515" y="308" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="700" text-anchor="middle">Analytics</text>

  <rect x="606" y="250" width="154" height="80" rx="10" fill="url(#card)" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
