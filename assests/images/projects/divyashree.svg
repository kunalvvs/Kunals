  <text x="649" y="370" font-family="Arial, sans-serif" font-size="11" fill="#e879f9" fill-opacity="0.8" text-anchor="middle">PAYMENT</text>
  <text x="649" y="396" font-family="Arial, sans-serif" font-size="22" fill="white" font-weight="800" text-anchor="middle">✓</text>
