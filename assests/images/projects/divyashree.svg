  <!-- Shopping bag icon -->
  <path d="M36 58 L44 58 L44 50 Q44 38 56 38 Q68 38 68 50 L68 58 L76 58 L80 96 L32 96 Z" fill="none" stroke="white" stroke-width="3"/>
  <line x1="44" y1="58" x2="44" y2="50" stroke="white" stroke-width="0"/>

