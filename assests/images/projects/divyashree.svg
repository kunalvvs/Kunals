  <rect x="126" y="324" width="80" height="24" rx="12" fill="#e879f9" fill-opacity="0.2"/>
  <text x="166" y="340" font-family="Arial, sans-serif" font-size="11" fill="#e879f9" text-anchor="middle" font-weight="700">Node.js</text>

  <rect x="216" y="324" width="80" height="24" rx="12" fill="#e879f9" fill-opacity="0.2"/>
  <text x="256" y="340" font-family="Arial, sans-serif" font-size="11" fill="#e879f9" text-anchor="middle" font-weight="700">MongoDB</text>

  <rect x="36" y="356" width="80" height="24" rx="12" fill="white" fill-opacity="0.1"/>
  <text x="76" y="372" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="700">Razorpay</text>

