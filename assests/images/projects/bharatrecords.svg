<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff9933;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#138808;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" />

  <!-- Subtle circle decorations -->
  <circle cx="700" cy="100" r="150" fill="#ff9933" fill-opacity="0.04" />
  <circle cx="700" cy="100" r="100" fill="#ff9933" fill-opacity="0.04" />
  <circle cx="80" cy="380" r="100" fill="#138808" fill-opacity="0.04" />

  <!-- India flag stripe top -->
  <rect x="0" y="0" width="800" height="4" fill="#ff9933"/>
  <rect x="0" y="4" width="800" height="4" fill="white" fill-opacity="0.9"/>
  <rect x="0" y="8" width="800" height="4" fill="#138808"/>

  <!-- Folder icon -->
  <path d="M36 52 L36 90 L100 90 L100 52 L70 52 L64 44 L36 44 Z" fill="#ff9933" fill-opacity="0.9"/>
  <rect x="36" y="58" width="64" height="32" rx="2" fill="#ff9933"/>

  <!-- Badge -->
  <rect x="36" y="110" width="148" height="26" rx="13" fill="#ff9933" fill-opacity="0.2"/>
  <text x="110" y="128" font-family="Arial, sans-serif" font-size="12" fill="#ff9933" text-anchor="middle" font-weight="700">DOCUMENT VAULT</text>

  <!-- Title -->
  <text x="36" y="190" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="white">Bharat</text>
  <text x="36" y="238" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#ff9933">Records</text>

  <!-- Divider - tricolor -->
  <rect x="36" y="254" width="22" height="3" rx="2" fill="#ff9933"/>
  <rect x="60" y="254" width="22" height="3" rx="2" fill="white"/>
  <rect x="84" y="254" width="22" height="3" rx="2" fill="#138808"/>

  <!-- Description -->
  <text x="36" y="286" font-family="Arial, sans-serif" font-size="14" fill="white" fill-opacity="0.8">DigiLocker-inspired secure document</text>
  <text x="36" y="306" font-family="Arial, sans-serif" font-size="14" fill="white" fill-opacity="0.8">management on AWS S3 + EC2</text>

  <!-- Tech chips -->
  <rect x="36" y="328" width="68" height="24" rx="12" fill="#ff9933" fill-opacity="0.25"/>
  <text x="70" y="344" font-family="Arial, sans-serif" font-size="11" fill="#ff9933" text-anchor="middle" font-weight="700">AWS S3</text>

  <rect x="114" y="328" width="68" height="24" rx="12" fill="#ff9933" fill-opacity="0.25"/>
  <text x="148" y="344" font-family="Arial, sans-serif" font-size="11" fill="#ff9933" text-anchor="middle" font-weight="700">AWS EC2</text>

  <rect x="192" y="328" width="82" height="24" rx="12" fill="#ff9933" fill-opacity="0.25"/>
  <text x="233" y="344" font-family="Arial, sans-serif" font-size="11" fill="#ff9933" text-anchor="middle" font-weight="700">Node.js</text>

  <rect x="36" y="360" width="80" height="24" rx="12" fill="#138808" fill-opacity="0.25"/>
  <text x="76" y="376" font-family="Arial, sans-serif" font-size="11" fill="#6fcf97" text-anchor="middle" font-weight="700">React.js</text>

  <rect x="126" y="360" width="80" height="24" rx="12" fill="#138808" fill-opacity="0.25"/>
  <text x="166" y="376" font-family="Arial, sans-serif" font-size="11" fill="#6fcf97" text-anchor="middle" font-weight="700">MongoDB</text>

  <!-- Right side - Document categories -->
  <rect x="430" y="30" width="340" height="390" rx="16" fill="white" fill-opacity="0.04" stroke="white" stroke-opacity="0.08" stroke-width="1"/>

  <text x="600" y="62" font-family="Arial, sans-serif" font-size="13" fill="white" fill-opacity="0.5" text-anchor="middle" font-weight="600" letter-spacing="2">DOCUMENT CATEGORIES</text>

  <!-- Category rows -->
  <rect x="450" y="76" width="300" height="48" rx="10" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
  <text x="474" y="106" font-family="Arial, sans-serif" font-size="20">🪪</text>
  <text x="506" y="98" font-family="Arial, sans-serif" font-size="13" fill="white" font-weight="700">Identity Documents</text>
  <text x="506" y="114" font-family="Arial, sans-serif" font-size="11" fill="white" fill-opacity="0.5">Aadhaar, PAN, Passport</text>
  <text x="726" y="106" font-family="Arial, sans-serif" font-size="11" fill="#6fcf97" font-weight="700" text-anchor="middle">3 files</text>

  <rect x="450" y="134" width="300" height="48" rx="10" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
  <text x="474" y="164" font-family="Arial, sans-serif" font-size="20">🎓</text>
  <text x="506" y="156" font-family="Arial, sans-serif" font-size="13" fill="white" font-weight="700">Education Records</text>
  <text x="506" y="172" font-family="Arial, sans-serif" font-size="11" fill="white" fill-opacity="0.5">Degrees, Marksheets, Certs</text>
  <text x="726" y="164" font-family="Arial, sans-serif" font-size="11" fill="#6fcf97" font-weight="700" text-anchor="middle">7 files</text>

  <rect x="450" y="192" width="300" height="48" rx="10" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
  <text x="474" y="222" font-family="Arial, sans-serif" font-size="20">🏦</text>
  <text x="506" y="214" font-family="Arial, sans-serif" font-size="13" fill="white" font-weight="700">Financial Documents</text>
  <text x="506" y="230" font-family="Arial, sans-serif" font-size="11" fill="white" fill-opacity="0.5">Bank, ITR, Form 16</text>
  <text x="726" y="222" font-family="Arial, sans-serif" font-size="11" fill="#6fcf97" font-weight="700" text-anchor="middle">5 files</text>

  <rect x="450" y="250" width="300" height="48" rx="10" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
  <text x="474" y="280" font-family="Arial, sans-serif" font-size="20">🏠</text>
  <text x="506" y="272" font-family="Arial, sans-serif" font-size="13" fill="white" font-weight="700">Property Documents</text>
  <text x="506" y="288" font-family="Arial, sans-serif" font-size="11" fill="white" fill-opacity="0.5">Registry, NOC, Land records</text>
  <text x="726" y="280" font-family="Arial, sans-serif" font-size="11" fill="#6fcf97" font-weight="700" text-anchor="middle">2 files</text>

  <rect x="450" y="308" width="300" height="48" rx="10" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
  <text x="474" y="338" font-family="Arial, sans-serif" font-size="20">⚕️</text>
  <text x="506" y="330" font-family="Arial, sans-serif" font-size="13" fill="white" font-weight="700">Medical Records</text>
  <text x="506" y="346" font-family="Arial, sans-serif" font-size="11" fill="white" fill-opacity="0.5">Reports, Prescriptions</text>
  <text x="726" y="338" font-family="Arial, sans-serif" font-size="11" fill="#6fcf97" font-weight="700" text-anchor="middle">4 files</text>

  <!-- AWS badge -->
  <rect x="450" y="372" width="300" height="36" rx="10" fill="#ff9933" fill-opacity="0.15" stroke="#ff9933" stroke-opacity="0.3" stroke-width="1"/>
  <text x="600" y="395" font-family="Arial, sans-serif" font-size="13" fill="#ff9933" text-anchor="middle" font-weight="700">☁️  Hosted on AWS S3 + EC2</text>
</svg>
