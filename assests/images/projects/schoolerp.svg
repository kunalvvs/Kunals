<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003566;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0077b6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.04" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" />
  <circle cx="740" cy="80" r="180" fill="white" fill-opacity="0.03"/>
  <circle cx="50" cy="400" r="120" fill="white" fill-opacity="0.03"/>

  <!-- Mortarboard icon -->
  <polygon points="60,60 36,72 60,84 84,72" fill="white" fill-opacity="0.9"/>
  <line x1="84" y1="72" x2="84" y2="90" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <path d="M44 80 Q44 96 60 96 Q76 96 76 80" fill="white" fill-opacity="0.7"/>

  <!-- Badge -->
  <rect x="36" y="112" width="118" height="26" rx="13" fill="white" fill-opacity="0.15"/>
  <text x="95" y="130" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="600">SCHOOL ERP</text>

  <!-- Title -->
  <text x="36" y="192" font-family="Arial, sans-serif" font-size="38" font-weight="800" fill="white">School</text>
  <text x="36" y="237" font-family="Arial, sans-serif" font-size="38" font-weight="800" fill="#90e0ef">Management</text>
  <text x="36" y="270" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="white" fill-opacity="0.6">ERP System</text>

  <!-- Divider -->
  <rect x="36" y="284" width="60" height="3" rx="2" fill="#90e0ef"/>

  <!-- Description -->
  <text x="36" y="314" font-family="Arial, sans-serif" font-size="14" fill="white" fill-opacity="0.8">Enterprise ERP with Admin, Teacher</text>
  <text x="36" y="334" font-family="Arial, sans-serif" font-size="14" fill="white" fill-opacity="0.8">&amp; Student panels</text>

  <!-- Tech chips -->
  <rect x="36" y="356" width="80" height="24" rx="12" fill="#90e0ef" fill-opacity="0.2"/>
  <text x="76" y="372" font-family="Arial, sans-serif" font-size="11" fill="#90e0ef" text-anchor="middle" font-weight="700">React.js</text>

  <rect x="126" y="356" width="80" height="24" rx="12" fill="#90e0ef" fill-opacity="0.2"/>
  <text x="166" y="372" font-family="Arial, sans-serif" font-size="11" fill="#90e0ef" text-anchor="middle" font-weight="700">Node.js</text>

  <rect x="216" y="356" width="80" height="24" rx="12" fill="#90e0ef" fill-opacity="0.2"/>
  <text x="256" y="372" font-family="Arial, sans-serif" font-size="11" fill="#90e0ef" text-anchor="middle" font-weight="700">MySQL</text>

  <!-- Right: 3 panels -->
  <!-- Admin Panel -->
  <rect x="430" y="24" width="160" height="402" rx="14" fill="url(#panel)" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
  <rect x="430" y="24" width="160" height="36" rx="14" fill="#0077b6" fill-opacity="0.6"/>
  <rect x="430" y="44" width="160" height="16" rx="0" fill="#0077b6" fill-opacity="0.6"/>
  <text x="510" y="48" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="700" text-anchor="middle">🏫  ADMIN</text>

  <text x="446" y="82" font-family="Arial, sans-serif" font-size="11" fill="white" fill-opacity="0.9">📋  Attendance Mgmt</text>
  <text x="446" y="106" font-family="Arial, sans-serif" font-size="11" fill="white" fill-opacity="0.9">💰  Fee Management</text>
  <text x="446" y="130" font-family="Arial, sans-serif" font-size="11" fill="white" fill-opacity="0.9">👤  Student Records</text>
  <text x="446" y="154" font-family="Arial, sans-serif" font-size="11" fill="white" fill-opacity="0.9">🗓️  Timetable</text>
  <text x="446" y="178" font-family="Arial, sans-serif" font-size="11" fill="white" fill-opacity="0.9">📢  Announcements</text>
  <text x="446" y="202" font-family="Arial, sans-serif" font-size="11" fill="white" fill-opacity="0.9">📊  Reports</text>
  <text x="446" y="226" font-family="Arial, sans-serif" font-size="11" fill="white" fill-opacity="0.9">🏆  Result Entry</text>
  <text x="446" y="250" font-family="Arial, sans-serif" font-size="11" fill="white" fill-opacity="0.9">👨‍🏫  Staff Mgmt</text>

  <!-- Teacher Panel -->
  <rect x="606" y="24" width="80" height="198" rx="14" fill="url(#panel)" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
  <rect x="606" y="24" width="80" height="36" rx="14" fill="#023e8a" fill-opacity="0.8"/>
  <rect x="606" y="44" width="80" height="16" fill="#023e8a" fill-opacity="0.8"/>
  <text x="646" y="48" font-family="Arial, sans-serif" font-size="11" fill="white" font-weight="700" text-anchor="middle">👨‍🏫 TEACHER</text>

  <text x="616" y="80" font-family="Arial, sans-serif" font-size="10" fill="white" fill-opacity="0.85">✅ Attendance</text>
  <text x="616" y="100" font-family="Arial, sans-serif" font-size="10" fill="white" fill-opacity="0.85">📝 Assignments</text>
  <text x="616" y="120" font-family="Arial, sans-serif" font-size="10" fill="white" fill-opacity="0.85">📊 Results</text>
  <text x="616" y="140" font-family="Arial, sans-serif" font-size="10" fill="white" fill-opacity="0.85">🗓️ Schedule</text>
  <text x="616" y="160" font-family="Arial, sans-serif" font-size="10" fill="white" fill-opacity="0.85">💬 Messages</text>
  <text x="616" y="180" font-family="Arial, sans-serif" font-size="10" fill="white" fill-opacity="0.85">📚 Syllabus</text>

  <!-- Student Panel -->
  <rect x="700" y="24" width="80" height="198" rx="14" fill="url(#panel)" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
  <rect x="700" y="24" width="80" height="36" rx="14" fill="#023e8a" fill-opacity="0.8"/>
  <rect x="700" y="44" width="80" height="16" fill="#023e8a" fill-opacity="0.8"/>
  <text x="740" y="48" font-family="Arial, sans-serif" font-size="11" fill="white" font-weight="700" text-anchor="middle">🎓 STUDENT</text>

  <text x="710" y="80" font-family="Arial, sans-serif" font-size="10" fill="white" fill-opacity="0.85">📅 Attendance</text>
  <text x="710" y="100" font-family="Arial, sans-serif" font-size="10" fill="white" fill-opacity="0.85">📋 Assignments</text>
  <text x="710" y="120" font-family="Arial, sans-serif" font-size="10" fill="white" fill-opacity="0.85">🏆 Results</text>
  <text x="710" y="140" font-family="Arial, sans-serif" font-size="10" fill="white" fill-opacity="0.85">💳 Fee Status</text>
  <text x="710" y="160" font-family="Arial, sans-serif" font-size="10" fill="white" fill-opacity="0.85">📢 Notices</text>
  <text x="710" y="180" font-family="Arial, sans-serif" font-size="10" fill="white" fill-opacity="0.85">🗓️ Timetable</text>

  <!-- Stats row -->
  <rect x="606" y="236" width="174" height="64" rx="10" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
  <text x="645" y="258" font-family="Arial, sans-serif" font-size="11" fill="#90e0ef" fill-opacity="0.9" text-anchor="middle">PANELS</text>
  <text x="645" y="285" font-family="Arial, sans-serif" font-size="24" fill="white" font-weight="800" text-anchor="middle">3</text>
  <line x1="682" y1="244" x2="682" y2="292" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
  <text x="726" y="258" font-family="Arial, sans-serif" font-size="11" fill="#90e0ef" fill-opacity="0.9" text-anchor="middle">MODULES</text>
  <text x="726" y="285" font-family="Arial, sans-serif" font-size="24" fill="white" font-weight="800" text-anchor="middle">15+</text>

  <!-- Bottom feature bar -->
  <rect x="430" y="316" width="350" height="110" rx="12" fill="white" fill-opacity="0.04" stroke="white" stroke-opacity="0.08" stroke-width="1"/>
  <text x="605" y="340" font-family="Arial, sans-serif" font-size="11" fill="white" fill-opacity="0.4" text-anchor="middle" letter-spacing="2">KEY FEATURES</text>
  <text x="448" y="365" font-family="Arial, sans-serif" font-size="12" fill="white" fill-opacity="0.8">✓  Role-based access control</text>
  <text x="448" y="385" font-family="Arial, sans-serif" font-size="12" fill="white" fill-opacity="0.8">✓  Automated fee receipts</text>
  <text x="448" y="405" font-family="Arial, sans-serif" font-size="12" fill="white" fill-opacity="0.8">✓  SMS &amp; email notifications</text>
</svg>
